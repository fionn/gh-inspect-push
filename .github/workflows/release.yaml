name: Release

on:
  push:
    tags: ["v*"]

jobs:

  release:

    name: Release
    runs-on: ubuntu-latest
    cache-mode: write-only

    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Precompile
        uses: cli/gh-extension-precompile@v2.2.0
        with:
          generate_attestations: true
          go_version_file: go.mod
